name: Checkout

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checkout-tests:
    name: Checkout tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the proposed change
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run checkout tests
        run: python3 -m unittest -v
