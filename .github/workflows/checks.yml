name: Checkout

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checkout-tests:
    name: Checkout tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the proposed change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run checkout tests
        run: python3 -m unittest -v
